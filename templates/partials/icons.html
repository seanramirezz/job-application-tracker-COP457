{% macro icon(name, size=20) %}
<svg class="icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'dashboard' %}<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>
{% elif name == 'companies' %}<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 21v-4h6v4M8 7h1m6 0h1M8 11h1m6 0h1"/>
{% elif name == 'jobs' %}<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13a20 20 0 0 0 18 0"/>
{% elif name == 'applications' %}<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M9 10h6M9 14h6M9 18h4"/>
{% elif name == 'contacts' %}<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 10a3 3 0 1 0 0-6M17 14a5 5 0 0 1 4 5v1"/>
{% elif name == 'match' %}<path d="m12 2 2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4L12 2Z"/><path d="m19 18 .7 1.3L21 20l-1.3.7L19 22l-.7-1.3L17 20l1.3-.7L19 18Z"/>
{% elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
{% elif name == 'arrow-right' %}<path d="M5 12h14m-6-6 6 6-6 6"/>
{% elif name == 'arrow-left' %}<path d="M19 12H5m6-6-6 6 6 6"/>
{% elif name == 'search' %}<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>
{% elif name == 'edit' %}<path d="m16 5 3 3-10 10-4 1 1-4L16 5Z"/><path d="m14 7 3 3"/>
{% elif name == 'trash' %}<path d="M4 7h16M10 4h4M7 7l1 14h8l1-14M10 11v6M14 11v6"/>
{% elif name == 'external' %}<path d="M14 4h6v6M20 4l-9 9M20 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h6"/>
{% elif name == 'calendar' %}<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>
{% elif name == 'check' %}<path d="m5 12 5 5L20 7"/>
{% elif name == 'warning' %}<path d="m12 3 10 18H2L12 3Z"/><path d="M12 9v4m0 4h.01"/>
{% elif name == 'x' %}<path d="M6 6l12 12M18 6 6 18"/>
{% elif name == 'link' %}<path d="M10 13a5 5 0 0 0 8-1l2-2a5 5 0 0 0-7-7l-2 2M14 11a5 5 0 0 0-8 1l-2 2a5 5 0 0 0 7 7l2-2"/>
{% elif name == 'trending' %}<path d="M3 17 9 11l4 4 8-8M15 7h6v6"/>
{% elif name == 'database' %}<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5M3 12a9 3 0 0 0 18 0"/>
{% else %}<circle cx="12" cy="12" r="9"/>{% endif %}
</svg>
{% endmacro %}
